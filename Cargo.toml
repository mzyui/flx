[package]
name = "fluxy"
version = "0.2.4"
edition = "2021"

[dependencies]
anyhow = "1.0.93"
thiserror = "2.0"
tokio = { version = "1.41.1", features = [
  "io-util",
  "rt-multi-thread",
  "sync",
  "net",
  "time",
  "macros",
] }
log = { version = "0.4.22", optional = true }
stderrlog = { version = "0.6.0", optional = true }
async-trait = "0.1.83"
status-line = { version = "0.2.0", optional = true }
colored = { version = "2.1.0", optional = true }
clap = { version = "4.5.22", optional = true, features = ["derive"] }
directories = "5.0.1"
maxminddb = "0.24.0"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"

tokio-stream = "0.1"
futures-util = "0.3"
hashbrown = "0.15.2"
hickory-resolver = "0.24"

# request client
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = [
  "client",
  "client-legacy",
  "http1",
] }
http-body-util = "0.1.2"
hyper-tls = "0.6.0"
httparse = "1.9.5"
native-tls = "0.2.12"
tokio-native-tls = "0.3.1"
scraper = "0.27.0"
regex = "1.13.1"
base64 = "0.23.0"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/cli/main.rs"
name = "fluxy"

[features]
default = ["log", "progress_bar", "clap"]
log = ["stderrlog", "dep:log"]
progress_bar = ["colored", "status-line"]
clap = ["dep:clap"]
