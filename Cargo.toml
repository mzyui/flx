[package]
name = "flx"
version = "0.2.5"
edition = "2021"
license = "MIT"
description = "Fast proxy scraper & validator with GeoIP filtering and 9 output formats"
repository = "https://github.com/mzyui/flx"
readme = "README.md"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.test]
opt-level = 0
debug = "line-tables-only"

[profile.test.package."*"]
opt-level = 1

[dependencies]
anyhow = "1.0.93"
thiserror = "2.0"
tokio = { version = "1.41.1", features = [
  "io-util",
  "rt-multi-thread",
  "sync",
  "fs",
  "net",
  "time",
  "macros",
  "signal",
] }
log = { version = "0.4.22", optional = true }
stderrlog = { version = "0.6.0", optional = true }
async-trait = "0.1.83"
colored = { version = "3.1.1", optional = true }
clap = { version = "4.5", optional = true, features = ["derive"] }
directories = "6.0.0"
maxminddb = "0.30.0"
serde = { version = "1.0.215", features = ["derive", "rc"] }
serde_json = "1.0.133"
toml = "0.8"
futures-util = "0.3"
memchr = "2.8.3"
aho-corasick = "1.1"
hashbrown = "0.17.1"
fs2 = "0.4.3"
hickory-resolver = "0.26.1"

# request client
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = [
  "client",
  "client-legacy",
  "http1",
] }
http-body-util = "0.1.2"
hyper-tls = "0.6.0"
httparse = "1.9.5"
native-tls = "0.2.12"
tokio-native-tls = "0.3.1"
# optional + vendored so the Android/Termux CI build can link OpenSSL statically;
# native-tls reuses the same openssl crate instance via feature unification.
openssl = { version = "0.10", optional = true, features = ["vendored"] }
scraper = "0.27.0"
regex = "1.13.1"
base64 = "0.23.0"
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parsers"
harness = false

[[bench]]
name = "proxy"
harness = false

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/cli/main.rs"
name = "flx"
required-features = ["clap"]


[features]
default = ["log", "progress_bar", "clap"]
log = ["stderrlog", "dep:log"]
progress_bar = ["colored"]
clap = ["dep:clap"]
vendored-openssl = ["dep:openssl"]
