[package]
name = "flx"
version = "0.3.0-beta.3"
edition = "2021"
license = "MIT"
description = "Fast proxy scraper & validator."
repository = "https://github.com/mzyui/flx"
readme = "README.md"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.test]
opt-level = 0
debug = "line-tables-only"

[profile.test.package."*"]
opt-level = 1

[dependencies]
anyhow = "1.0.93"
tokio = { version = "1.41.1", features = [
  "io-util",
  "rt-multi-thread",
  "sync",
  "fs",
  "net",
  "time",
  "macros",
  "signal",
] }
log = { version = "0.4.22", optional = true, features = ["std"] }

async-trait = "0.1.83"
clap = { version = "4.5", optional = true, features = ["derive"] }
maxminddb = "0.30.0"
serde = { version = "1.0.215", features = ["derive", "rc"] }
serde_json = "1.0.133"
toml = "0.8"
futures-util = "0.3"
memchr = "2.8.3"
hashbrown = "0.17.1"

# interactive TUI (`flx` with no arguments). Ratatui 0.30 keeps crossterm
# behind one per-version flag; enabling both majors would give the event
# stream and raw-mode tracking two separate queues, so pick only 0.29.
ratatui = { version = "0.30", optional = true, default-features = false, features = [
  "crossterm_0_29",
  "layout-cache",
] }
crossterm = { version = "0.29", optional = true, features = ["event-stream"] }
# Table cells are measured in display cells, never in bytes.
unicode-width = { version = "0.2", optional = true }

# request client
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = [
  "client",
  "client-legacy",
  "http1",
] }
http-body-util = "0.1.2"
httparse = "1.9.5"
hyper-rustls = { version = "0.27", default-features = false, features = [
  "http1",
  "native-tokio",
  "aws-lc-rs",
  "tls12",
] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
webpki-roots = "0.26"
scraper = "0.27.0"
regex = "1.13.1"
base64 = "0.23.0"
flate2 = "1.1"
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/cli/main.rs"
name = "flx"
required-features = ["clap"]


[features]
default = ["log", "progress_bar", "clap"]
log = ["dep:log"]
progress_bar = []
clap = ["dep:clap"]
# Optional interactive TUI (`flx find --tui`, `flx grab --tui`).
# Off by default; opt in with `--features tui`.
tui = ["dep:ratatui", "dep:crossterm", "dep:unicode-width"]
# Optional rotating proxy endpoint (`flx serve` + `Flx::serve`).
# Off by default while serve stays suboptimal; opt in with `--features serve`.
serve = []


[dev-dependencies]
# Golden frames for the TUI (`TestBackend` + `insta` snapshots).
insta = "1"
# A real terminal for the TUI's lifecycle smoke test.
portable-pty = "0.9"
