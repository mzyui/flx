name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.2.5, must already exist)
        required: true

env:
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ env.RELEASE_REF }}
        run: |
          TAG="${RELEASE_REF#refs/tags/}"
          cat > /tmp/release-notes.md <<'EOF'
          Fast proxy scraper & validator.

          ## Assets
          | File | Platform |
          |---|---|
          | `flx-x86_64-unknown-linux-gnu.tar.gz` | Linux x86_64 |
          | `flx-aarch64-unknown-linux-gnu.tar.gz` | Linux ARM64 |
          | `flx-aarch64-linux-android.tar.gz` | Android (Termux) |
          | `flx-x86_64-apple-darwin.tar.gz` | macOS Intel |
          | `flx-aarch64-apple-darwin.tar.gz` | macOS Apple Silicon |
          | `flx-x86_64-pc-windows-msvc.zip` | Windows x86_64 |

          Every archive has a `.sha256` checksum alongside it.

          ## Install (Termux)

          ```sh
          tar xzf flx-aarch64-linux-android.tar.gz
          chmod +x flx
          ./flx
          ```

          See `flx --help` for usage.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "flx $TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --title "flx $TAG" --notes-file /tmp/release-notes.md
          fi

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          # (required) Comma-separated list of binary names (non-extension portion of filename) to build and upload.
          # Note that glob pattern is not supported yet.
          bin: flx
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.RELEASE_REF }}

  # Termux/Android: cross-compile only needs the NDK linker (rustls has no
  # OpenSSL dependency), so this stays a dedicated job outside the matrix.
  upload-assets-android:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_API_LEVEL: 21
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android
      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Configure NDK toolchain
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API="aarch64-linux-android$ANDROID_API_LEVEL"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/$API-clang"
            echo "CC_aarch64_linux_android=$TOOLCHAIN/$API-clang"
            echo "CXX_aarch64_linux_android=$TOOLCHAIN/$API-clang++"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
          } >> "$GITHUB_ENV"
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: flx
          target: aarch64-linux-android
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.RELEASE_REF }}
