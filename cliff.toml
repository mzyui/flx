# git-cliff config for dynamic GitHub Release notes.
# Only user-facing changes reach the release page; internal chores,
# style cleanups, test churn, and version-bump commits are skipped.

[changelog]
header = "Fast proxy scraper & validator.\n"
body = """
## What's Changed
{% set features = commits | filter(attribute="group", value="Features") -%}
{% set fixes = commits | filter(attribute="group", value="Bug Fixes") -%}
{% set perf = commits | filter(attribute="group", value="Performance") -%}
{% set minor = commits | filter(attribute="group", value="Documentation") | concat(with=commits | filter(attribute="group", value="Refactors")) | concat(with=commits | filter(attribute="group", value="Other")) -%}
{% if features | length > 0 -%}
### Features
{% for commit in features -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
{% endif -%}
{% if fixes | length > 0 -%}
### Bug Fixes
{% for commit in fixes -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
{% endif -%}
{% if perf | length > 0 -%}
### Performance
{% for commit in perf -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
{% endif -%}
{% if minor | length > 0 -%}
<details>
<summary>Documentation, refactors and other changes ({{ minor | length }})</summary>

{% for commit in minor -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
</details>
{% endif -%}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
tag_pattern = "v[0-9]*"
ignore_tags = ""
skip_tags = ""
commit_parsers = [
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore.*bump version", skip = true },
  { message = "^chore", skip = true },
  { message = "^style", skip = true },
  { message = "^test", skip = true },
  { message = "^docs.*\\bspec\\b", skip = true },
  { message = "^docs\\(tui\\) redesign", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactors" },
  { message = ".*", group = "Other" },
]
